name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Download test ROM suites
        run: |
          mkdir -p testroms/games
          curl -sSL -o roms.zip https://github.com/c-sp/game-boy-test-roms/releases/download/v7.0/game-boy-test-roms-v7.0.zip
          unzip -q roms.zip -d testroms
          curl -sSL -o testroms/games/libbet.gb https://github.com/pinobatch/libbet/releases/download/v0.08/libbet.gb
          curl -sSL -o testroms/games/gb240p.gb https://github.com/pinobatch/240p-test-mini/releases/download/v0.23/gb240p.gb
          curl -sSL -o testroms/games/ucity.gbc https://github.com/AntonioND/ucity/releases/download/v1.3/ucity.gbc

      - name: Run emulator tests
        run: ./gradlew testDebugUnitTest

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/test-screens/*.txt
            app/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
